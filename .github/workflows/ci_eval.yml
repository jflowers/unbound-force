# Eval smoke test — runs eval fixtures against the eval-infra driver.
#
# Triggers on push to the eval branch and on PRs that touch eval/opencode files.
# Posts eval summary as a GitHub Actions job summary (always) and as a
# PR comment (on pull_request events only).

name: Eval

on:
  push:
    branches:
      - eval/smoke-test-constitution-check
  pull_request:
    branches: [main]
    paths:
      - '.opencode/**'
      - '.eval/**'

permissions: {}

jobs:
  eval:
    uses: jflowers/eval-infra/.github/workflows/reusable_opencode_eval.yml@main
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    secrets:
      gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
      gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
    with:
      fixture-path: .eval/fixtures
      opencode-version: '1.2.26'
      timeout-minutes: 10
